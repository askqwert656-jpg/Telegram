name: PotuzhnoGram Android APK

on:
  push:
    branches:
      - potuzhnogram-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          ref: potuzhnogram-development
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build components
        run: |
          set -euo pipefail
          packages=("platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1")
          installed=false
          for attempt in 1 2 3; do
            echo "Android SDK installation attempt $attempt/3"
            if sdkmanager "${packages[@]}"; then
              installed=true
              break
            fi
            echo "SDK package installation failed; removing incomplete NDK download before retry."
            rm -rf "$ANDROID_SDK_ROOT/ndk/27.2.12479018"
            sleep 10
          done
          if [[ "$installed" != true ]]; then
            echo "ERROR: Android SDK components could not be installed after 3 attempts."
            exit 1
          fi
          set +o pipefail
          yes | sdkmanager --licenses
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "$license_status" -ne 0 ]]; then
            echo "ERROR: Android SDK license acceptance failed."
            exit "$license_status"
          fi

      - name: Configure Telegram API credentials
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          set -euo pipefail
          [[ "$APP_ID" =~ ^[0-9]+$ ]] || { echo "ERROR: APP_ID is missing or invalid"; exit 1; }
          [[ "$APP_HASH" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "ERROR: APP_HASH is missing or invalid"; exit 1; }

          python3 - <<'PY'
          import os, re
          app_id = os.environ["APP_ID"]
          app_hash = os.environ["APP_HASH"]
          path = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          with open(path, encoding="utf-8") as f:
              source = f.read()
          source, n1 = re.subn(
              r'public\s+static\s+(?:final\s+)?int\s+APP_ID\s*=\s*[0-9]+\s*;',
              f'public static int APP_ID = {app_id};', source)
          source, n2 = re.subn(
              r'public\s+static\s+(?:final\s+)?String\s+APP_HASH\s*=\s*"[^"]*"\s*;',
              f'public static String APP_HASH = "{app_hash}";', source)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"BuildVars update failed (APP_ID={n1}, APP_HASH={n2})")
          with open(path, "w", encoding="utf-8") as f:
              f.write(source)
          print("Telegram API credentials configured.")
          PY

      - name: Prepare and verify private signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "ERROR: SIGNING_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ERROR: SIGNING_STORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: SIGNING_KEY_PASSWORD is missing"; exit 1; }
          test -n "$EXPECTED_CERT_SHA256" || { echo "ERROR: SIGNING_CERT_SHA256 is missing"; exit 1; }

          KEYSTORE="$GITHUB_WORKSPACE/TMessagesProj/config/release.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          ACTUAL_CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE" -alias potuzhogram -storepass:env STORE_PASSWORD 2>/dev/null | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT_SHA256_NORMALIZED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':\r\n ' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$ACTUAL_CERT_SHA256" || "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256_NORMALIZED" ]]; then
            echo "ERROR: Keystore certificate does not match SIGNING_CERT_SHA256."
            exit 1
          fi
          echo "Signing certificate verified."
          ACTUAL_CERT_SHA1="$(keytool -list -v -keystore "$KEYSTORE" -alias potuzhogram -storepass:env STORE_PASSWORD 2>/dev/null | awk '/SHA1:/{print $2; exit}' | tr -d ':')"
          if [[ -z "$ACTUAL_CERT_SHA1" ]]; then
            echo "ERROR: Could not read signing certificate SHA-1."
            exit 1
          fi
          echo "Release signing certificate SHA-1: $ACTUAL_CERT_SHA1"

      - name: Build signed PotuzhnoGram release APK
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: potuzhogram
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g"

      - name: Build PotuzhnoGram debug APK (Folder 42 check)
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: potuzhogram
        run: |
          set -euo pipefail
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: PotuzhnoGram-release-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Folder 42 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PotuzhnoGram-folder42-debug
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 7
